name: Tests

on:
  workflow_run:
    workflows: [Build]
    branches: [dev]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: tests-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Require a successful build
        env:
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [[ "$BUILD_CONCLUSION" != "success" ]]; then
            echo "The triggering Build workflow concluded with: $BUILD_CONCLUSION"
            exit 1
          fi

      - name: Download test products
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: remmich-test-products
          path: ${{ runner.temp }}/RemmichBuildArtifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Restore test products
        id: test-products
        env:
          BUILD_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          test_products_path="$RUNNER_TEMP/RemmichTestProducts"
          mkdir -p "$test_products_path"
          tar -C "$test_products_path" \
            -xzf "$RUNNER_TEMP/RemmichBuildArtifact/remmich-test-products.tar.gz"
          tested_revision="$(<"$test_products_path/tested-revision")"
          if [[ ! "$tested_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The downloaded build artifact has an invalid tested revision."
            exit 1
          fi
          if [[ "$tested_revision" != "$BUILD_REVISION" ]]; then
            echo "The downloaded test products do not match the triggering Build revision."
            exit 1
          fi
          xctestrun_path="$(find "$test_products_path/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          if [[ -z "$xctestrun_path" ]]; then
            echo "No xctestrun file was found in the downloaded build products."
            exit 1
          fi
          echo "tested-revision=$tested_revision" >> "$GITHUB_OUTPUT"
          echo "XCTESTRUN_PATH=$xctestrun_path" >> "$GITHUB_ENV"

      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.test-products.outputs.tested-revision }}

      - name: Select available iPhone simulator
        run: bash Scripts/select-ci-simulator.sh

      - name: Test Immich API package
        run: swift test --jobs 2 --package-path Packages/ImmichAPI

      - name: Boot iPhone simulator
        run: |
          # 已启动设备不重复 boot；其他启动失败必须正常暴露。
          if ! xcrun simctl list devices booted --json | jq -e --arg id "$IPHONE_SIMULATOR_ID" \
            '[.devices[][] | select(.udid == $id)] | length > 0' > /dev/null; then
            xcrun simctl boot "$IPHONE_SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$IPHONE_SIMULATOR_ID" -b

      - name: Test app logic
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN_PATH" \
            -destination "$IPHONE_DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/RemmichUnitTests.xcresult" \
            -jobs 2 \
            -parallel-testing-enabled NO \
            -only-testing:RemmichTests \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      - name: Record successful tested revision
        env:
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          TESTED_REVISION: ${{ steps.test-products.outputs.tested-revision }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "RemmichReleaseContext")
          path.mkdir()
          (path / "release-context.json").write_text(json.dumps({
              "build_run_id": int(os.environ["BUILD_RUN_ID"]),
              "tested_revision": os.environ["TESTED_REVISION"],
          }))
          PY

      - name: Upload release context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remmich-release-context
          path: ${{ runner.temp }}/RemmichReleaseContext/release-context.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Report app logic failures
        if: ${{ failure() }}
        run: |
          result_path="$RUNNER_TEMP/RemmichUnitTests.xcresult"
          if [[ -d "$result_path" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$result_path" --format json
          fi

      - name: Shut down simulators
        if: ${{ always() }}
        run: xcrun simctl shutdown all || true

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remmich-test-results-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/Remmich*.xcresult
          if-no-files-found: ignore
          retention-days: 7
